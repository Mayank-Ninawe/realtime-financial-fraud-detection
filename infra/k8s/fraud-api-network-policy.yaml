apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-api
spec:
  podSelector:
    matchLabels:
      app: fraud-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
