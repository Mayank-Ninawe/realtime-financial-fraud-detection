services:
  postgres:
    image: postgres:17-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fraud-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_app -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 12
  fraud-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/backend/src:/app/backend
      DATABASE_URL: postgresql+psycopg://fraud_app:${POSTGRES_PASSWORD}@postgres:5432/fraud_detection
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    volumes:
      - ../../models:/app/models:ro
      - ../../reports:/app/reports:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  fraud-postgres-data: